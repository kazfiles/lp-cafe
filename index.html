<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cafe Bloom | 新店舗オープン</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="fv">
            <div class="fv-inner">
                <h1 class="fv-title">
                    <span class="break">心ほどける一杯を、</span>
                    <span>あなたの日常に。</span>
                </h1>
                <p class="fv-lead">
                    <span class="lead-top">熊本に新しくオープンする、</span>
                    街角カフェ「Cafe Bloom」
                </p>
                <a href="#content" class="btn">来店予約はこちら</a>
            </div><!-- /.fv-inner -->
        </header><!-- /.fv -->

        <section class="concept">
            <h2>Concept</h2>
            <ul>
                <li>厳選した豆を使用</li>
                <li>ゆっくり過ごせる店内</li>
                <li>テイクアウト対応</li>
            </ul>
        </section><!-- /.concept -->

        <section class="menu">
            <h2>Menu</h2>
            <div class="menu-list">
                <div class="menu-item">ブレンドコーヒー</div><!-- /.menu-item -->
                <div class="menu-item">カフェラテ</div><!-- /.menu-item -->
                <div class="menu-item">自家製スイーツ</div><!-- /.menu-item -->
            </div><!-- /.menu-list -->
        </section><!-- /.menu -->

        <section class="access">
            <h2>Access</h2>
            <p>営業時間 : 10:00 ~ 18:00</p>
            <p>住所 : 熊本県熊本市中央区○○町1-2-3</p>
        </section><!-- /.access -->

        <section class="contact">
            <h2>ご予約・お問い合わせ</h2>
            <a href="#" class="btn btn--contact">お問い合わせはこちら</a>
        </section><!-- /.contact -->

        <footer>
            <small>&copy; 2026 Cafe Bloom</small>
        </footer>

    </body>
</html>
